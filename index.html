<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Nano Banana AI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #1e1e1e;
      color: #ffffff;
      box-sizing: border-box;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #b3b3b3;
    }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #3a3a3a;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      height: 70px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #f7d000;
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
      color: #888;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="form-group">
    <label for="apiKey">API Key de Nano Banana / Provider</label>
    <input type="password" id="apiKey" placeholder="Tu API Key..." />
  </div>

  <div class="form-group">
    <label for="prompt">Prompt (Descripción)</label>
    <textarea id="prompt" placeholder="Ej: Un render 3D de un plátano futurista con iluminación neón, estilo cyberpunk"></textarea>
  </div>

  <div class="form-group">
    <label for="aspectRatio">Proporción de Aspecto</label>
    <select id="aspectRatio">
      <option value="1:1">1:1 (Cuadrada - 512x512)</option>
      <option value="16:9">16:9 (Horizontal - 800x450)</option>
      <option value="9:16">9:16 (Vertical - 450x800)</option>
    </select>
  </div>

  <button id="generateBtn">Generar e Insertar Imagen</button>
  <div id="status"></div>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const statusDiv = document.getElementById('status');

    generateBtn.addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const aspectRatio = document.getElementById('aspectRatio').value;

      if (!apiKey) {
        statusDiv.textContent = 'Por favor, ingresa tu API Key.';
        return;
      }
      if (!prompt) {
        statusDiv.textContent = 'Por favor, escribe una descripción.';
        return;
      }

      statusDiv.textContent = 'Generando imagen con Nano Banana...';
      generateBtn.disabled = true;

      try {
        // Llamada a la API para generar la imagen
        const response = await fetch('https://api.kie.ai/v1/nano-banana/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            prompt: prompt,
            aspect_ratio: aspectRatio,
            model: 'nano-banana'
          })
        });

        if (!response.ok) {
          throw new Error(`Error API (${response.status}): ${response.statusText}`);
        }

        const data = await response.json();
        const imageUrl = data.image_url || (data.data && data.data[0]?.url);

        if (!imageUrl) {
          throw new Error('No se obtuvo la URL de la imagen en la respuesta.');
        }

        // Descargar la imagen a ArrayBuffer para pasarla a Penpot
        const imgFetch = await fetch(imageUrl);
        const imageBuffer = await imgFetch.arrayBuffer();

        // Enviar buffer y metadatos al hilo principal de Penpot
        parent.postMessage({
          type: 'create-image',
          buffer: Array.from(new Uint8Array(imageBuffer)),
          prompt: prompt,
          aspectRatio: aspectRatio
        }, '*');

        statusDiv.textContent = '¡Imagen creada e insertada!';
      } catch (err) {
        console.error(err);
        statusDiv.textContent = `Error: ${err.message}`;
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
