<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caballero Hidalgo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="main-page">
    <div class="main-container">
        <div class="title-container">
            <img src="images/titulo.svg" alt="Caballero Hidalgo" class="title-svg">
        </div>
        
        <div class="menu-buttons">
            <a href="#" class="menu-button" id="local-multiplayer">Multijugador local</a>
            <a href="#" class="menu-button" id="local-ai">Local contra IA</a>
            <a href="#" class="menu-button" id="learn-play">Aprender a jugar</a>
        </div>
    </div>

    <script>
        // Funcionalidad para los botones del menú
        document.getElementById('local-multiplayer').addEventListener('click', function(e) {
            e.preventDefault();
            // Redirigir al juego original con modo solo
            window.location.href = 'original_game.html?mode=solo';
        });

        document.getElementById('local-ai').addEventListener('click', function(e) {
            e.preventDefault();
            // Redirigir al juego original con modo IA
            window.location.href = 'original_game.html?mode=ai';
        });

        document.getElementById('learn-play').addEventListener('click', function(e) {
            e.preventDefault();
            // Abrir las reglas en nueva ventana
            window.open('rules.html', '_blank');
        });
    </script>
</body>
</html>
